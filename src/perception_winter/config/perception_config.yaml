lidar_only:
  carmaker:
    # Topic Configuration
    lidar_raw_topic: "/carmaker/pointcloud"
    lidar_raw_topic2: "/velodyne_points"

    # ========== ENHANCED GROUND REMOVAL PARAMETERS ==========
    # Multi-Stage Ground Filtering Pipeline
    ground_removal:
      # Preprocessing
      voxel_downsample_size: 0.1  # meters for density normalization
      single_axis_smoothing_cell_size: 0.05  # meters for ground smoothing
      ground_smoothing_threshold: 0.03  # 3cm above minimum height
      
      # Angular Sector Fitting (LineFit-style)
      num_angular_sectors: 180  # 2-degree sectors for 360 coverage
      min_points_per_sector: 5
      lowest_points_ratio: 0.3  # Use lowest 30% for ground fitting
      
      # Zonal PCA Fitting (Patchwork-style)  
      concentric_rings: [[0,3], [3,6], [6,9], [9,12]]  # distance ranges
      segments_per_ring: 4  # 4 segments per ring (90 degrees each)
      min_points_per_zone: 10
      
      # Elevation Grid Filtering (GroundGrid-style)
      grid_cell_size: 0.15  # 15cm grid cells
      min_points_per_cell: 3
      adaptive_variance_base: 0.002  # 2mm base variance
      adaptive_variance_scale: 0.01   # scales with distance
      
      # Cone Restoration
      base_cylinder_radius: 0.12  # cone_base_radius
      base_cylinder_height: 0.10  # 10cm height for base restoration
      min_cone_cluster_points: 4   # min_cluster_points
      
      # Performance
      use_parallel_processing: true
      max_threads: 8

    # ========== ORIGINAL PARAMETERS (PRESERVED) ==========
    # Ground Removal Parameters (Optimized for RANSAC) - KEPT FOR BACKWARD COMPATIBILITY
    ransac_threshold: 0.015
    min_z_normal_component: 0.80
    max_slope_deviation_deg: 40.0
    max_ground_iterations: 8
    min_points_for_plane: 150

    # Clustering Parameters (Optimized for DBSCAN)
    dbscan_epsilon: 0.20
    dbscan_minpoints: 3

    # Region of Interest (ROI) Boundaries
    roi_y_min: -3.50
    roi_y_max: 3.50
    roi_z_min: -0.63
    roi_z_max: 0.40
    roi_x_max: 12.0  # Optimized from second code

    # Vehicle Body Exclusion Zone
    car_front_x: 1.15
    car_side_y: 1.25

    # Cone Physical Properties
    cone_base_radius: 0.12
    lidar_offset: 1.532
    cone_height: 0.1629

    # ML Model Configuration
    num_bins: 10
    feature_size: 20
    z_min: -0.640
    z_max: -0.300
    bin_width: 0.034  # (z_max - z_min) / num_bins
    confidence_threshold: 0.95

    # Cluster Filtering Parameters (Optimized from second code)
    min_cluster_height: 0.15
    max_cluster_height: 0.60
    max_cluster_width: 0.75
    min_cluster_points: 4

    # Orange Cone Detection
    orange_cone_distance_threshold: 10.0
    orange_cone_min_points: 20

    # Visualization Control
    publish_cluster_centers: True  # Control flag for cluster centers visualization
    publish_filtered_points: True  # Control flag for filtered points visualization

    # ONNX Model Configuration
    onnx_model_paths:
      - "${PACKAGE_SHARE_DIR}/cone_model.onnx"
      - "${PACKAGE_SHARE_DIR}/share/perception_winter/cone_model.onnx"
      - "${PACKAGE_SHARE_DIR}/cone_model.onnx" 
      - "./cone_model.onnx"
      - "/home/ishaan/Desktop/DebugFInal/install/perception_winter/share/perception_winter/cone_model.onnx"
    default_model_path: "${PACKAGE_SHARE_DIR}/cone_model.onnx"

    # Cone Detection Parameters
    cone_distance_x_min: 3.35  # Minimum x distance for cone validation
    cone_distance_x_max: 12.0  # Maximum x distance for cone validation
    intensity_threshold_blue: 1000000.0  # Intensity threshold for ground truth blue cones

    # Cone Position Calculation Weights
    cone_position_weights:
      w_median: 0.7   # Weight for median position in cone calculation
      w_min_x: 0.3    # Weight for minimum x position in cone calculation  
      w_min_y: 0.3    # Weight for minimum y position in cone calculation

    # Heuristic Classifier Parameters
    heuristic_classifier:
      moving_average_factor: 0.1  # Factor for determining moving average kernel size
      min_kernel_size: 3          # Minimum kernel size for moving average